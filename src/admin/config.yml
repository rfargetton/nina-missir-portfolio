backend:
  name: git-gateway
  branch: main
  repo: rfargetton/nina-missir-portfolio

local_backend: true

site_url: https://ninamissir.netlify.app
logo_url: /assets/images/brand/logo.svg

publish_mode: editorial_workflow
media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "pages"
    label: "📄 Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    filter: { field: "draft", value: false }
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown" }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false }

  - name: "services"
    label: "🎨 Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL de la page (ex: decor-vitrine)" }
      - { label: "Ordre menu", name: "order", widget: "number" }
      - { label: "Description courte", name: "description", widget: "text" }
      - { label: "Image couverture", name: "image", widget: "image" }
      - { label: "Présentation complète", name: "body", widget: "markdown" }
      - label: "FAQ"
        name: "faq"
        widget: "list"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Réponse", name: "answer", widget: "text" }

  - name: "homepage"
    label: "🏠 Accueil"
    files:
      - name: "home"
        label: "Contenu de la page d'accueil"
        file: "src/content/homepage.md"
        fields:
          - { label: "Accroche", name: "eyebrow", widget: "string" }
          - { label: "Titre principal", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Image de fond (bannière)", name: "hero_image", widget: "image", required: false }
          - { label: "Texte bouton principal", name: "hero_cta1_label", widget: "string" }
          - { label: "Texte bouton secondaire", name: "hero_cta2_label", widget: "string" }
          - { label: "Titre section Services", name: "services_title", widget: "string" }
          - { label: "Sous-titre section Services", name: "services_subtitle", widget: "text" }
          - { label: "Titre section Projets", name: "projects_title", widget: "string" }
          - { label: "Sous-titre section Projets", name: "projects_subtitle", widget: "text" }
          - { label: "Texte bouton Projets", name: "projects_cta_label", widget: "string" }
          - { label: "Titre section Témoignages", name: "testimonials_title", widget: "string" }
          - { label: "Titre bloc contact", name: "cta_title", widget: "string" }
          - { label: "Sous-titre bloc contact", name: "cta_subtitle", widget: "text" }
          - { label: "Texte bouton contact", name: "cta_button_label", widget: "string" }

  - name: "projects"
    label: "🖼️ Projets"
    folder: "src/content/projects"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Service(s)"
        name: "services"
        widget: "relation"
        collection: "services"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        multiple: true
      - { label: "Description courte", name: "description", widget: "text" }
      - { label: "Image couverture", name: "image", widget: "image" }
      - label: "Galerie images"
        name: "gallery"
        widget: "list"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Description", name: "alt", widget: "string" }
      - { label: "Contenu détaillé", name: "body", widget: "markdown" }

  - name: "testimonials"
    label: "⭐ Témoignages"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom client", name: "name", widget: "string" }
      - { label: "Entreprise", name: "company", widget: "string" }
      - { label: "Fonction", name: "role", widget: "string" }
      - { label: "Citation", name: "quote", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "settings"
    label: "⚙️ Paramètres"
    files:
      - name: "site"
        label: "Configuration du site"
        file: "src/_data/site.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "URL du site", name: "url", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Téléphone", name: "phone", widget: "string" }
          - { label: "Adresse", name: "address", widget: "string" }

      - name: "navigation"
        label: "Menu principal"
        file: "src/_data/navigation.json"
        format: "json"
        fields:
          - label: "Éléments du menu"
            name: "items"
            widget: "list"
            types:
              - label: "Accueil"
                name: "home"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string", default: "Accueil" }
                  - { label: "Ordre", name: "order", widget: "number" }
              - label: "Page"
                name: "page"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Page cible"
                    name: "reference"
                    widget: "relation"
                    collection: "pages"
                    search_fields: ["title"]
                    value_field: "permalink"
                    display_fields: ["title"]
                  - { label: "Ordre", name: "order", widget: "number" }
              - label: "Service"
                name: "service"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Service cible"
                    name: "reference"
                    widget: "relation"
                    collection: "services"
                    search_fields: ["title"]
                    value_field: "slug"
                    display_fields: ["title"]
                  - { label: "Ordre", name: "order", widget: "number" }
